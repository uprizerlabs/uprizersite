<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uprizer Labs</title>
  <meta name="description" content="Uprizer Labs, software consulting and product development.">
  <meta name="theme-color" content="#0b0b10" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f6f6f8" media="(prefers-color-scheme: light)">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="canonical" href="https://uprizer.com/">
  <style>
    :root {
      --bg: #0b0b10;
      --fg: #f4f4f7;
      --muted: #8b8b98;
      --line: rgba(255, 255, 255, 0.12);
      --glow-a: rgba(124, 92, 255, 0.22);
      --glow-b: rgba(34, 211, 238, 0.14);
      --accent-a: #7c5cff;
      --accent-b: #22d3ee;
      color-scheme: dark light;
    }
    @media (prefers-color-scheme: light) {
      :root {
        --bg: #f6f6f8;
        --fg: #111117;
        --muted: #5d5d6b;
        --line: rgba(0, 0, 0, 0.12);
        --glow-a: rgba(124, 92, 255, 0.16);
        --glow-b: rgba(34, 211, 238, 0.12);
      }
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: grid;
      grid-template-rows: 1fr auto;
      min-height: 100dvh;
      background:
        radial-gradient(40rem 30rem at 30% 20%, var(--glow-a), transparent 70%),
        radial-gradient(36rem 28rem at 75% 85%, var(--glow-b), transparent 70%),
        var(--bg);
      color: var(--fg);
      font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    main {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2.5rem;
      padding: 3rem 1.5rem;
      text-align: center;
    }

    .logo {
      margin: 0;
      font-size: clamp(2.25rem, 7vw, 4.5rem);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1;
    }
    .logo .labs { font-weight: 300; color: var(--muted); }

    .contact {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      min-height: 2.75rem;
    }
    .email {
      display: inline-flex;
      align-items: center;
      gap: 0.6rem;
      padding: 0.7rem 1.15rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: var(--fg);
      font-size: 1rem;
      text-decoration: none;
      transition: border-color 0.2s, background-color 0.2s;
    }
    .email:hover { border-color: var(--accent-a); background: var(--glow-a); }
    .email svg { width: 1.05em; height: 1.05em; color: var(--muted); }
    .copy {
      padding: 0.7rem 0.95rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: none;
      color: var(--muted);
      font: inherit;
      font-size: 0.875rem;
      cursor: pointer;
      transition: color 0.2s, border-color 0.2s;
    }
    .copy:hover { color: var(--fg); border-color: var(--accent-b); }
    a:focus-visible, button:focus-visible { outline: 2px solid var(--accent-b); outline-offset: 3px; }
    noscript { color: var(--muted); }

    footer {
      padding: 1.5rem;
      color: var(--muted);
      font-size: 0.8125rem;
      text-align: center;
    }

    @media (prefers-reduced-motion: no-preference) {
      main > * { animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both; }
      main > :nth-child(2) { animation-delay: 0.15s; }
      @keyframes rise { from { opacity: 0; transform: translateY(12px); } }
    }
  </style>
</head>
<body>
  <main>
    <h1 class="logo">
      <span>Uprizer <span class="labs">Labs</span></span>
    </h1>

    <div class="contact" id="contact" data-e="bW9jLnJlemlycHVAb2xsZWg=">
      <noscript>hello (at) uprizer (dot) com</noscript>
    </div>
  </main>

  <footer>Uprizer Labs <span id="year">2026</span></footer>

  <script>
    // The address is stored base64-encoded and reversed so it never appears
    // in the HTML source; it is assembled here and the mailto link is only
    // attached when someone interacts with it.
    (function () {
      var box = document.getElementById("contact");
      var addr = atob(box.dataset.e).split("").reverse().join("");

      var link = document.createElement("a");
      link.className = "email";
      link.href = "#";
      link.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="5" width="18" ' +
        'height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>';
      link.appendChild(document.createTextNode(addr));
      var arm = function () { link.href = "mailto:" + addr; };
      ["pointerenter", "focus", "touchstart"].forEach(function (ev) {
        link.addEventListener(ev, arm, { once: true, passive: true });
      });

      var copy = document.createElement("button");
      copy.type = "button";
      copy.className = "copy";
      copy.textContent = "Copy";
      copy.addEventListener("click", function () {
        navigator.clipboard.writeText(addr).then(function () {
          copy.textContent = "Copied";
          setTimeout(function () { copy.textContent = "Copy"; }, 1600);
        });
      });

      document.getElementById("year").textContent = new Date().getFullYear();

      box.append(link);
      if (navigator.clipboard) box.append(copy);
    })();
  </script>
</body>
</html>
